<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Activity8</title>
        <script>
            function myFunction() {
                var name="Jaja";
                alert("Hi " + name + " I am an alert box!"); //'+' sign is concatenation
            }
        </script>
    </head>
    
    <body>
        <h2>JavaScript Alert</h2>
        <button class="button" onclick="myFunction()">Click here!</button>
    </body>
    
</html>
