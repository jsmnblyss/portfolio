<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Name Picker</title>
    <link rel="stylesheet" href="styles 13.css">
</head>
<body>
    <div class="container">
        <h1>Random Name Picker</h1>
        <textarea id="nameInput" rows="5" cols="30" placeholder="Enter names, each on a new line"></textarea>
        <div class="buttons">
            <button id="pickButton">Pick a Name</button>
            <button id="clearButton">Clear</button>
        </div>
        <p>Total Names: <span id="totalNames">0</span></p>
        <p>Random Number Picked: <span id="randomNumber"></span></p>
        <h2 id="pickedName"></h2>
    </div>
    <script src="act13.js"></script>
</body>
</html>
